<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef0e9" />
    <meta name="description" content="Search and inspect the objects in the ORIGIN collection." />
    <title>ORIGIN Collection</title>
    <link rel="preconnect" href="https://numismatics.org" crossorigin />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <a class="admin-wordmark" href="index.html">ORIGIN</a>
      <span>Collection</span>
      <a href="index.html">Play</a>
    </header>

    <main class="admin-main">
      <section class="collection-controls" aria-labelledby="collection-title">
        <div>
          <h1 id="collection-title">Collection</h1>
          <p id="collection-count" aria-live="polite">Loading objects</p>
        </div>
        <div class="control-grid">
          <label class="search-control">
            <span>Search</span>
            <input id="collection-search" type="search" placeholder="Object, issuer, mint, year" autocomplete="off" />
          </label>
          <label>
            <span>Type</span>
            <select id="type-filter">
              <option value="all">All objects</option>
              <option value="coin">Coins</option>
              <option value="banknote">Banknotes</option>
            </select>
          </label>
          <label>
            <span>Department</span>
            <select id="department-filter">
              <option value="all">All departments</option>
            </select>
          </label>
          <label>
            <span>Sort</span>
            <select id="sort-order">
              <option value="relevance">Relevance</option>
              <option value="oldest">Oldest first</option>
              <option value="newest">Newest first</option>
              <option value="title">Title</option>
            </select>
          </label>
        </div>
      </section>

      <section id="collection-scroll" class="collection-scroll" aria-label="Currency objects" aria-busy="true">
        <div id="collection-spacer" class="collection-spacer"></div>
        <p id="empty-collection" class="empty-collection" hidden>No objects match those filters.</p>
      </section>
    </main>

    <script type="module" src="src/admin.js"></script>
  </body>
</html>
